version: '3.8'

services:
  hwatch:
    build: .
    container_name: hwatch-app
    ports:
      - "8080:8080"
    volumes:
      # 挂载配置文件
      - ./config.yaml:/app/config.yaml:ro
      # 挂载日志目录
      - ./log:/app/log
      # 挂载输出文件目录
      - ./outfile:/app/outfile
      # 挂载数据库文件
      - ./hwatch.db:/app/hwatch.db
    environment:
      - LOG_LEVEL=INFO
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    networks:
      - hwatch-network

networks:
  hwatch-network:
    driver: bridge
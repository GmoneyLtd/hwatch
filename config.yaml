# 任务配置列表
tasks:
  # 第一个设备的配置
  - connection:
      # 设备主机名
      hostname: Router_A
      # 设备IP地址
      ip: 192.168.1.100
      # SSH用户名
      ssh_username: admin
      # SSH密码
      ssh_password: admin123
      # SNMP团体名
      snmp_community: public
      # SSH端口号，默认为22
      ssh_port: 22
      # SNMP端口号，默认为161
      snmp_port: 161
      # SSH超时时间（秒）
      ssh_timeout: 10
      # SNMP超时时间（秒）
      snmp_timeout: 10
      # SSH重试次数
      ssh_retry: 3
      # SNMP重试次数
      snmp_retry: 3
    snmp:
      oids:
        # SNMP OID配置
        - alias: [sysName,]
          # 是否启用该OID监控
          enabled: false
          # 执行频率（暂时未使用）
          frequency: 0
          # 执行间隔（秒）
          interval: 15
          # SNMP OID值
          oid: 1.3.6.1.2.1.1.5.0
          # 正则表达式匹配模式（无）
          pattern_match: null
          # 监控类型（snmpget表示单个OID获取）
          type: snmpget
          # 存储方式
          storage: sqlite
    ssh:
      commands:
        # SSH命令配置 - 第一组命令
        - alias: [version_name,]
          # 要执行的命令
          command: show version
          # 是否启用该命令
          enabled: false
          # 执行频率（暂时未使用）
          frequency: 0
          # 执行间隔（秒）
          interval: 0
          # 正则表达式匹配模式（无）
          pattern_match: null
          # 监控类型（ssh表示通过SSH执行命令）
          type: ssh
          # 存储方式
          storage: sqlite
        # datapath network ingress命令配置
        - alias: [queue_empty_count, queue_empty_recovery]
          # 要执行的命令
          command: show datapath network ingress
          # 是否启用该命令
          enabled: enable
          # 执行频率（暂时未使用）
          frequency: 0
          # 执行间隔（秒）
          interval: 60
          # 正则表达式匹配模式，用于提取queue_empty_count和queue_empty_recovery的值
          pattern_match: \|\s*G\s*\|\s*\[000\]\s*\|\s*Current Entries\s+(\d+)
          # 监控类型（ssh表示通过SSH执行命令）
          type: ssh
          # 存储方式
          storage: sqlite
      # 第二组SSH命令配置 - 合理需求，用于执行不同的命令获取指标
      commands:
        # 版本信息命令配置
        - alias: version
          # 要执行的命令
          command: show version
          # 是否启用该命令
          enabled: false
          # 执行频率（暂时未使用）
          frequency: 0
          # 执行间隔（秒）
          interval: 0
          # 正则表达式匹配模式，用于提取version值
          pattern_match: \|\s*G\s*\|\s*\[000\]\s*\|\s*version\s+(\d+)
          # 监控类型（ssh表示通过SSH执行命令）
          type: ssh
          # 存储方式
          storage: file
  # 第二个设备的配置
  - connection:
      # 设备主机名
      hostname: Fortinet_60
      # 设备IP地址
      ip: 192.168.2.1
      # SNMP团体名
      snmp_community: awatch
      # SNMP端口号，默认为161
      snmp_port: 161
      # SNMP超时时间（秒）
      snmp_timeout: 2
      # SNMP重试次数
      snmp_retry: 0
    snmp:
      oids:
        # Fortinet防火墙会话计数OID配置
        - alias: [fgSysSesCount,]
          # 是否启用该OID监控
          enabled: true
          # 执行频率（暂时未使用）
          frequency: 0
          # 执行间隔（秒）
          interval: 5
          # Fortinet防火墙会话计数OID
          oid: 1.3.6.1.4.1.12356.101.4.1.8.0
          # 正则表达式匹配模式（无）
          pattern_match: null
          # 监控类型（snmpget表示单个OID获取）
          type: snmpget
          # 存储方式
          storage: sqlite
        # Fortinet处理器使用率OID配置
        - alias: [fgProcessorUsage,]
          # 是否启用该OID监控
          enabled: true
          # 执行频率（暂时未使用）
          frequency: 0
          # 执行间隔（秒）
          interval: 5
          # Fortinet处理器使用率OID
          oid: 1.3.6.1.4.1.12356.101.4.4.2.1.2
          # 正则表达式匹配模式（无）
          pattern_match: null
          # 监控类型（snmpwalk表示遍历OID树）
          type: snmpwalk
          # 存储方式
          storage: file
      community: public
      port: 161
      retry: 3
      timeout: 10
    ssh:
      password: admin123
      port: 22
      retry: 2
      timeout: 10
      username: admin
  ip: 192.168.1.100
  name: Router_A
- connection:
    snmp:
      community: awatch
      port: 161
      retry: 0
      timeout: 2
    ssh:
      password: ChengduMicro@2025
      port: 22
      retry: 0
      timeout: 2
      username: admin
  ip: 192.168.2.1
  name: Fortinet_60
- connection:
    snmp:
      community: awatch
      port: 161
      retry: 0
      timeout: 2
    ssh:
      password: admin
      port: 22
      retry: 0
      timeout: 2
      username: admin
  ip: 192.168.2.11
  name: AP-205

tasks:
- alias: run_show_command
  enabled: true
  labels:
  - BIOS_Version
  - Branch_Point
  protocol: ssh
  schedule:
    frequency: 20
    mode: delay
    seconds: 30
  ssh:
    command:
    - get system status
    - get system arp
    parse:
      calculate:
      - /1000000
      - '*10'
      regex: (?s)BIOS version:\s*(\d+).*?Branch point:\s*(\d+)
  storage: file
  targets:
  - Fortinet_60

- alias: get_router_a_version
  enabled: false
  protocol: ssh
  schedule:
    frequency: 1
  ssh:
    command:
    - show version
  storage: sqlite
  targets:
  - Router_A

- alias: clear_router_a_counters
  enabled: false
  protocol: ssh
  schedule:
    frequency: 1
  ssh:
    command:
    - clear counters
  storage: null
  targets:
  - Router_A

- alias: check_router_a_datapath
  enabled: false
  labels:
  - queue_empty_count
  protocol: ssh
  schedule:
    frequency: 0
    mode: delay
    seconds: 60
  ssh:
    command:
    - show datapath network ingress
    parse:
      regex: \|\s*G\s*\|\s*\[000\]\s*\|\s*Current Entries\s+(\d+)
  storage: sqlite
  targets:
  - Router_A

- alias: fgProcessorUsage_per
  enabled: true
  labels:
  - fgProcessorUsage
  protocol: snmp
  schedule:
    frequency: 0
    mode: interval
    seconds: 5
  snmp:
    oid:
    - 1.3.6.1.4.1.12356.101.4.4.2.1.2
    type:
    - snmpwalk
  storage: sqlite
  targets:
  - Fortinet_60

- alias: mixed_snmp_monitoring
  enabled: false
  labels:
  - SessionCount
  - CPUUsage
  - MemoryUsage
  protocol: snmp
  schedule:
    frequency: 0
    mode: interval
    seconds: 10
  snmp:
    oid:
    - 1.3.6.1.4.1.12356.101.4.1.8.0
    - 1.3.6.1.4.1.12356.101.4.4.2.1.2
    - 1.3.6.1.4.1.12356.101.4.1.4.0
    type:
    - snmpget
    - snmpwalk
    - snmpget
  storage: sqlite
  targets:
  - Fortinet_60

- alias: system_info_collection
  enabled: true
  labels:
  - SysUpTimeDays
  - SysDescr
  - SysContact
  protocol: snmp
  schedule:
    frequency: 0
    mode: interval
    seconds: 15
  snmp:
    oid:
    - 1.3.6.1.2.1.1.3.0
    - 1.3.6.1.2.1.1.1.0
    - 1.3.6.1.2.1.1.4.0
    type:
    - snmpget
    - snmpget
    - snmpget
  storage: file
  targets:
  - Fortinet_60
  - AP-205

- alias: comprehensive_device_monitoring
  enabled: false
  labels:
  - SystemUptime
  - CPUCore
  - MemoryUsage
  - InterfaceIn
  protocol: snmp
  schedule:
    frequency: 0
    mode: interval
    seconds: 30
  snmp:
    oid:
    - 1.3.6.1.2.1.1.3.0
    - 1.3.6.1.4.1.12356.101.4.4.2.1.2
    - 1.3.6.1.4.1.12356.101.4.1.4.0
    - 1.3.6.1.2.1.2.2.1.10
    type:
    - snmpget
    - snmpwalk
    - snmpget
    - snmpwalk
  storage: sqlite
  targets:
  - Fortinet_60
